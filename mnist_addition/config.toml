# Dataset Configuration

[data]
batch_size = 32
train_split = 0.7
val_split = 0.15
random_seed = 42
num_workers = 4

# Model Architecture
[model]
hidden_size = 128
num_layers = 2
dropout_rate = 0.2
learning_rate = 0.001

# Training Parameters
[train]
epochs = 50
device = "mps"  
save_dir = "checkpoints"